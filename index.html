<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiveAlpha — NSE Listed Shares</title>
  <meta name="description"
    content="Every share listed on the NSE cash market, with live prices, F&amp;O eligibility and market-cap classification." />
  <meta name="theme-color" content="#ffffff" />

  <!-- SVG first for browsers that take it (stays crisp at any size); the .ico
       carries 16/32/48 bitmaps for everything else, Safari included. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="FiveAlpha" />
  <!-- Applies the saved theme before first paint. Without this the page
         renders in the OS theme and then flips once React mounts. Keep the
         storage key in step with src/hooks/useTheme.ts. -->
  <script>
    try {
      var t = localStorage.getItem('nse.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
