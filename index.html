<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover hands the notch and home-indicator areas to the page;
       every inset in index.css honours env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FiveAlpha — NSE Listed Shares</title>
  <meta name="description"
    content="Every share listed on the NSE cash market, with live prices, F&amp;O eligibility and market-cap classification." />
  <!-- One tag, no media: src/hooks/useTheme.ts rewrites it from the resolved
       theme, which follows the in-app toggle as well as the OS. -->
  <meta name="theme-color" content="#f5f3ee" />

  <!-- The mark is artwork, not paths, so there is no SVG favicon to prefer;
       the .ico carries its own bitmap at every size down to 16. -->
  <link rel="icon" href="/favicon.ico?v=11" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=11" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="FiveAlpha" />
  <!-- Applies the saved theme before first paint. Without this the page
         renders in the OS theme and then flips once React mounts. Keep the
         storage key in step with src/hooks/useTheme.ts. -->
  <script>
    try {
      var t = localStorage.getItem('nse.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { }
    // The browser chrome too, so a dark phone never flashes a light address bar.
    var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#121110' : '#f5f3ee');
  </script>
  <!-- Self-hosted and subset (see the @font-face rules in src/index.css).
       Preloaded so both arrive with the stylesheet rather than after it: the
       body face sets every row, the display face the breadth figures that are
       the first large paint. No third-party connection at all. -->
  <link rel="preload" href="/fonts/plex-sans.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FiveAlpha" />
  <meta property="og:title" content="FiveAlpha — NSE &amp; BSE listed shares" />
  <meta property="og:description"
    content="Every share on the NSE and BSE with live prices, UT Bot signals, the all-time-high screen and your watchlists." />
  <meta property="og:image" content="/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="FiveAlpha — every listed share, ruled into one page you can read." />
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
