<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover hands the notch and home-indicator areas to the page;
       every inset in index.css honours env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FiveAlpha — NSE Listed Shares</title>
  <meta name="description"
    content="Every share listed on the NSE cash market, with live prices, F&amp;O eligibility and market-cap classification." />
  <!-- Auto's two grounds (Geist Light, Geist Dark) until a theme is chosen; after
       that the pre-paint script below, and src/lib/theme.ts, write the active
       theme's canvas into both. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

  <!-- The mark is artwork, not paths, so there is no SVG favicon to prefer;
       the .ico carries its own bitmap at every size down to 16. -->
  <link rel="icon" href="/favicon.ico?v=11" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=11" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="FiveAlpha" />
  <!-- The saved theme, applied before first paint so no frame is ever in the
       wrong one. Reads the keys src/lib/theme.ts writes; the Auto pair and the
       legacy map must match src/themes/index.ts. Everything else — an
       unknown id, a cached accent fitted to another theme — is corrected by
       the app once it starts. -->
  <script>
    (function () {
      var root = document.documentElement, pref = 'auto', accent = null, color = null;
      try {
        pref = localStorage.getItem('nse.theme') || 'auto';
        accent = JSON.parse(localStorage.getItem('nse.accent') || 'null');
        color = localStorage.getItem('nse.theme-color');
      } catch (e) { }
      // Retired ids, mapped to their successors (LEGACY in src/themes/index.ts).
      pref = {
        system: 'auto', light: 'geist-light', dark: 'geist-dark', porcelain: 'geist-light',
        monochrome: 'geist-light', contrast: 'primer-light', newsprint: 'rose-pine-dawn',
        sandstone: 'rose-pine-dawn', graphite: 'geist-dark', ink: 'terminal-amber',
        terminal: 'terminal-amber', midnight: 'tokyo-night', fjord: 'nord',
        forest: 'catppuccin-mocha', dusk: 'catppuccin-mocha'
      }[pref] || pref;
      var id = pref === 'auto'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'geist-dark' : 'geist-light')
        : pref;
      root.setAttribute('data-theme', id);
      if (accent && accent.theme === id && accent.tokens) {
        for (var k in accent.tokens) root.style.setProperty(k, accent.tokens[k]);
        root.setAttribute('data-accent', accent.hex);
      }
      if (color && pref !== 'auto') {
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
      }
    })();
  </script>
  <!-- Self-hosted and subset (see the @font-face rules in src/index.css).
       The body face is preloaded — it sets every row. The display face is not:
       it would compete with the script that renders the page, and its
       metric-matched fallback (index.css) means the swap moves nothing. -->
  <link rel="preload" href="/fonts/plex-sans.woff2" as="font" type="font/woff2" crossorigin />
  <!-- The marks are CSS masks, which the browser only finds once styles are
       computed — and the stacked one is the largest paint on the sign-in and
       loading screens. Masks are fetched in CORS mode, so `crossorigin` is what
       lets these preloads be reused instead of fetched twice. -->
  <link rel="preload" href="/brand/stacked.webp" as="image" type="image/webp" crossorigin fetchpriority="high" />
  <link rel="preload" href="/brand/lockup.webp" as="image" type="image/webp" crossorigin />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FiveAlpha" />
  <meta property="og:title" content="FiveAlpha — NSE &amp; BSE listed shares" />
  <meta property="og:description"
    content="Every share on the NSE and BSE with live prices, UT Bot signals, the all-time-high screen and your watchlists." />
  <meta property="og:image" content="/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="FiveAlpha — every listed share, ruled into one page you can read." />
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
