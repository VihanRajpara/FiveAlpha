<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiveAlpha — NSE Listed Shares</title>
  <meta name="description"
    content="Every share listed on the NSE cash market, with live prices, F&amp;O eligibility and market-cap classification." />
  <!-- One tag, no media: src/hooks/useTheme.ts rewrites it from the resolved
       theme, which follows the in-app toggle as well as the OS. -->
  <meta name="theme-color" content="#ffffff" />

  <!-- The mark is artwork, not paths, so there is no SVG favicon to prefer;
       the .ico carries its own bitmap at every size down to 16. -->
  <link rel="icon" href="/favicon.ico?v=10" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=10" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="FiveAlpha" />
  <!-- Applies the saved theme before first paint. Without this the page
         renders in the OS theme and then flips once React mounts. Keep the
         storage key in step with src/hooks/useTheme.ts. -->
  <script>
    try {
      var t = localStorage.getItem('nse.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
