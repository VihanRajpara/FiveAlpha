# Cloudflare Worker: ./dist at the edge, plus the /api proxy in worker/index.ts.
#
# The app talks to Supabase directly from the browser, so nothing here needs a
# secret. VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY are BUILD-time
# values: Vite inlines them into the bundle during `npm run build`, so they must
# be set as *build* variables in the Cloudflare dashboard. Adding them as Worker
# runtime vars here would do nothing — the bundle is already built by then.
name = "fivealpha"
main = "worker/index.ts"
compatibility_date = "2026-08-09"

[assets]
directory = "./dist"
# The Worker reaches the static files through this binding.
binding = "ASSETS"

# Every unmatched path returns index.html instead of Cloudflare's own 404.
not_found_handling = "single-page-application"

# …except /api/*, which must reach the Worker. Without this the SPA fallback
# would answer a chart request with index.html, and every chart would fail on
# `JSON.parse` of an HTML document.
run_worker_first = ["/api/*"]
