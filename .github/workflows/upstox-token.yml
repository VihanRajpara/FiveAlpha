# Refreshes the Upstox access token every morning and stores it in the database.
#
# The OAuth token dies at 3:30 AM IST (22:00 UTC) with no refresh token, so
# something has to log in daily. This runs at 22:10 UTC, which is 5h35m before
# nse-sync-quotes resumes at 03:45 UTC — enough slack that GitHub's scheduler
# being late (it routinely is, by tens of minutes) costs nothing.
#
# It runs here rather than in an Edge Function for one reason: Upstox's login
# endpoints are fronted by TLS-fingerprint checks, and upstox-totp clears them
# with curl_cffi's Chrome impersonation. Deno's fetch cannot impersonate a TLS
# stack, so the same flow hand-written in a Supabase function would be a few
# hundred lines of undocumented, versioned endpoints that may not connect at all.
#
# Nothing about the app depends on this file. Delete it the day you switch to an
# Analytics Token, which lasts a year and needs no login at all.

name: Refresh Upstox token

# `schedule` and `workflow_dispatch` only — never a pull_request trigger. This
# job can read every secret below, and a fork must never be able to run it.
on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstox-token
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      UPSTOX_USERNAME: ${{ secrets.UPSTOX_USERNAME }}
      UPSTOX_PASSWORD: ${{ secrets.UPSTOX_PASSWORD }}
      UPSTOX_PIN_CODE: ${{ secrets.UPSTOX_PIN_CODE }}
      UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
      UPSTOX_CLIENT_ID: ${{ secrets.UPSTOX_CLIENT_ID }}
      UPSTOX_CLIENT_SECRET: ${{ secrets.UPSTOX_CLIENT_SECRET }}
      UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned. The login endpoints this package talks to are undocumented and
      # versioned (/v6/auth/1fa, /v4/otp-totp/verify, /v3/auth/2fa); when Upstox
      # moves them the fix is to bump this number, and an unpinned install would
      # turn that into a silent change of behaviour instead of a visible one.
      - run: pip install --disable-pip-version-check upstox-totp==1.0.8

      - name: Refresh if needed
        run: python scripts/refresh_upstox_token.py

      # Retried once — a flaky OTP round trip should not cost a trading day.
      # Anything worse than flaky fails the run, and GitHub mails you about it.
      - name: Retry once
        if: failure()
        run: python scripts/refresh_upstox_token.py
